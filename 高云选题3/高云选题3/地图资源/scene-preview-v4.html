const $=id=>document.getElementById(id),version=4,base=`rescue_maze_v${version}/`,modelPath=base+`community_fire_rescue_v${version}.glb`;

  const response=await fetch(base+'config.json',{cache:'no-store'});if(!response.ok)throw Error('config.json '+response.status);cfg=await response.json();
  const r=cfg.robot;document.title=`社区消防街区 v${cfg.version} · 窄街多回路地图`;$('mapTitle').textContent=cfg.title;$('versionLabel').textContent=`V${cfg.version}`;$('mapSubtitle').textContent=`${cfg.site.join(' × ')} m / ${[r.length,r.width,r.height].map(x=>Math.round(x*100)).join(' × ')} cm 小车 / 可编辑 Blender 地图`;$('cameraHeight').textContent=`${r.camera_height.toFixed(2)} m`;$('cameraPitch').textContent=`${r.camera_pitch_down_deg}°`;$('cameraHFOV').textContent=`${r.camera_hfov_deg}°`;$('cameraResolution').textContent=r.camera_resolution.join(' : ');$('staticFrame').textContent=cfg.animation.default_frame;

  extent=Math.max(...cfg.site);center.set(cfg.site[0]/2,cfg.site[1]/2,.45);topCam.position.set(center.x,center.y,45);topCam.lookAt(center.x,center.y,0);
  sensorCam.aspect=r.camera_resolution[0]/r.camera_resolution[1];sensorCam.fov=THREE.MathUtils.radToDeg(2*Math.atan(Math.tan(THREE.MathUtils.degToRad(r.camera_hfov_deg/2))/sensorCam.aspect));sensorCam.updateProjectionMatrix();
